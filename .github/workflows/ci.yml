name: CI

on:
  workflow_dispatch:
    inputs:
      live_acceptance:
        description: Run live MYBOX integration acceptance using the MYBOX_PAT repository secret
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Bun 1.4 / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Git diff check
        run: git diff --check

  live-acceptance:
    name: Live MYBOX acceptance
    if: github.event_name == 'workflow_dispatch' && inputs.live_acceptance
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MYBOX_PAT: ${{ secrets.MYBOX_PAT }}
      MYBOX_INTEGRATION: "1"
      MYBOX_DOWNLOAD_PROBE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require MYBOX_PAT
        shell: bash
        run: |
          if [[ -z "$MYBOX_PAT" ]]; then
            echo "MYBOX_PAT repository secret is required for live acceptance" >&2
            exit 1
          fi

      - name: Build
        run: bun run build

      - name: Run live integration acceptance
        run: bun test test/integration

      - name: Run targeted download probe
        run: bun run test:download-probe

      - name: Final diff check
        run: git diff --check
