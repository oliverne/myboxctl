name: CI

on:
  workflow_dispatch:
    inputs:
      live_acceptance:
        description: Run live MYBOX integration acceptance using the MYBOX_PAT repository secret
        required: false
        default: false
        type: boolean
      download_probe:
        description: Run only the targeted signed-download contract probe
        required: false
        default: false
        type: boolean
      server_semantics_probe:
        description: Run the targeted delete and name-semantics hardening probe
        required: false
        default: false
        type: boolean
      unicode_probe:
        description: Run the targeted cross-platform Unicode filename compatibility probe
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Bun 1.4 / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build
        run: bun run build

      - name: Git diff check
        run: git diff --check

  live-acceptance:
    name: Live MYBOX acceptance
    if: github.event_name == 'workflow_dispatch' && (inputs.live_acceptance || inputs.download_probe || inputs.server_semantics_probe || inputs.unicode_probe)
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MYBOX_PAT: ${{ secrets.MYBOX_PAT }}
      MYBOX_INTEGRATION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require MYBOX_PAT
        shell: bash
        run: |
          if [[ -z "$MYBOX_PAT" ]]; then
            echo "MYBOX_PAT repository secret is required for live acceptance" >&2
            exit 1
          fi

      - name: Build
        run: bun run build

      - name: Run live integration acceptance
        if: inputs.live_acceptance
        run: bun test test/integration

      - name: Run targeted download probe
        if: inputs.download_probe
        env:
          MYBOX_DOWNLOAD_PROBE: "1"
        run: bun run test:download-probe

      - name: Run server semantics probe
        if: inputs.server_semantics_probe
        run: bun run test:server-semantics-probe

      - name: Run Unicode filename probe
        if: inputs.unicode_probe
        run: bun run test:unicode-probe

      - name: Final diff check
        run: git diff --check

  local-transfer-contract:
    name: Phase 15 local transfer contracts / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify local transfer, diagnostics, and launcher contracts
        run: >-
          bun test
          src/features/tree-manifest.test.ts
          src/features/recursive-transfer.test.ts
          src/diagnostics.test.ts
          test/cli/diagnostics.test.ts
          src/local/download-file.test.ts
          src/features/download.test.ts
          test/http/upload.test.ts
          test/http/download.test.ts
          test/cli/upload.test.ts
          test/cli/download.test.ts
          test/cli/npm-package.test.ts
