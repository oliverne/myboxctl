name: Publish npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, for example v0.2.2
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @oliverne/myboxctl
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Build Node bundle
        env:
          TAG: ${{ inputs.tag }}
        run: bun run build -- --version "${TAG#v}"

      - name: Prepare npm package
        env:
          TAG: ${{ inputs.tag }}
        run: bun run prepare:npm -- --version "${TAG#v}"

      - name: Setup Node for npm Trusted Publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Verify npm Trusted Publishing runtime
        run: |
          node --version
          npm --version

      - name: Verify npm package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "$(node release/npm/bin/myboxctl.js --version)" = "${TAG#v}"
          node release/npm/bin/myboxctl.js --help >/dev/null
          npm pack --dry-run ./release/npm

      - name: Publish
        run: bun run publish:npm
