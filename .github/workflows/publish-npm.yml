name: Publish npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, for example v0.4.0
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-npm-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @oliverne/myboxctl
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release note
        env:
          TAG: ${{ inputs.tag }}
        run: bun run verify:release-notes -- --tag "$TAG"

      - name: Check
        run: bun run check

      - name: Build Node bundle
        env:
          TAG: ${{ inputs.tag }}
        run: bun run build -- --version "${TAG#v}"

      - name: Prepare npm package
        env:
          TAG: ${{ inputs.tag }}
        run: bun run prepare:npm -- --version "${TAG#v}"

      - name: Setup Node for npm Trusted Publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Verify npm Trusted Publishing runtime
        run: |
          node --version
          npm --version

      - name: Verify npm package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "$(node release/npm/bin/myboxctl.js --version)" = "${TAG#v}"
          node release/npm/bin/myboxctl.js --help >/dev/null
          npm pack --dry-run ./release/npm

      - name: Publish
        run: bun run publish:npm

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Render release note
        env:
          TAG: ${{ inputs.tag }}
        run: |
          bun run verify:release-notes \
            --tag "$TAG" \
            --out "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,body,isDraft,isPrerelease \
            > "$RUNNER_TEMP/existing.json" 2>/dev/null
          then
            expected=$(cat "$RUNNER_TEMP/release-notes.md")
            tag_name=$(jq -r '.tagName' "$RUNNER_TEMP/existing.json")
            existing=$(jq -r '.body' "$RUNNER_TEMP/existing.json")
            is_draft=$(jq -r '.isDraft' "$RUNNER_TEMP/existing.json")
            is_prerelease=$(jq -r '.isPrerelease' "$RUNNER_TEMP/existing.json")
            if [ "$tag_name" != "$TAG" ] \
              || [ "$is_draft" = "true" ] \
              || [ "$is_prerelease" = "true" ] \
              || [ "$existing" != "$expected" ]
            then
              echo "::error::$TAG release body mismatch; not overwriting"
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
                --json url --jq .url
              exit 1
            fi
            echo "::notice::Release $TAG already matches the note"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json url --jq .url
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag
