name: Update Homebrew tap

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  update-tap:
    name: Update oliverne/homebrew-tap
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Require a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: test "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "false"

      - name: Download formula
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "myboxctl.rb"

      - name: Checkout tap
        uses: actions/checkout@v5
        with:
          repository: oliverne/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Commit formula
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p tap/Formula
          cp myboxctl.rb tap/Formula/myboxctl.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/myboxctl.rb
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "myboxctl ${TAG#v}"
          git push
